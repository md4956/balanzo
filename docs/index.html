<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fed">
<!-- TODO: replace the text-based "S" icon with a proper app icon (icon.svg and the PNG sizes) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Balanzo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #1d1f23; --muted: #6b7280; --card: #ffffff; --accent: #2f6fed; --line: #d9dce1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --fg: #eceef2; --muted: #9aa1ad; --card: #21242b; --accent: #6ea0ff; --line: #383d47; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 12px; }
  textarea, pre {
    width: 100%; height: 40vh; min-height: 200px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font-family: ui-monospace, Menlo, monospace;
  }
  /* Both 16px: iOS zooms in on an input under 16px, and one size keeps the two boxes reading the same */
  textarea { display: block; font-size: 16px; line-height: 1.5; resize: none; }  /* block: an inline box leaves a gap under it that pre does not */
  pre { margin: 0; overflow: auto; font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  pre.placeholder { color: var(--muted); }
  pre.stale { opacity: 0.55; }
  pre.updated { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { pre.updated { animation: none; } }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: 0.85rem; }
  .status { min-height: 1.2em; margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  button, .button {
    flex: 1 1 auto; font: inherit; text-align: center; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type="file"] { display: none; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .output .row { margin-top: 10px; }
  #drop {
    display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    background: rgba(47, 111, 237, 0.15); border: 3px dashed var(--accent); font-size: 1.3rem; color: var(--accent);
    pointer-events: none;
  }
  body.dragging #drop { display: flex; }
  /* Tablets and desktops: input and report side by side, filling the window, so nothing scrolls */
  @media (min-width: 700px) {
    body { height: 100vh; height: 100dvh; }
    main { height: 100%; box-sizing: border-box; padding: 16px 20px; display: flex; flex-direction: column; }
    h1 { margin: 0 0 8px; }
    .workspace { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .input, .output { display: flex; flex-direction: column; min-height: 0; }
    textarea, pre { flex: 1; height: auto; min-height: 160px; }
  }
</style>
</head>
<body>
<main>
  <h1>Balanzo</h1>
  <p class="status" id="status"></p>

  <div class="workspace">
    <section class="input">
      <textarea id="input" aria-label="Expenses" spellcheck="false" placeholder="# Dinner&#10;Anna 60 Anna Ben Chloe&#10;Ben 30 Ben Chloe"></textarea>
      <div class="row">
        <button class="primary" id="calculate">Calculate</button>
        <button type="button" class="button" id="load">Load .txt or .md</button>
        <input type="file" id="file" accept=".txt,.md,text/plain,text/markdown">
      </div>
    </section>

    <section class="output">
      <pre id="report" class="placeholder" aria-live="polite">The report appears here.</pre>
      <div class="row">
        <button id="copy">Copy report</button>
        <button id="download" disabled>Download</button>
      </div>
    </section>
  </div>
  <p class="hint">Ctrl+Enter or ⌘+Enter calculates. You can also drop a .txt or .md file anywhere on this page.</p>
  <p class="hint" id="draft"></p>
</main>
<div id="drop">Drop the .txt or .md file here</div>

<script src="balanzo.js"></script>
<script>
  const input = document.getElementById('input');
  const report = document.getElementById('report');
  const status = document.getElementById('status');
  let calculatedText = null;  // the input the report was made from
  let calculatedOk = true;    // false when the last calculation stopped with an error
  let fileExt = '.txt';       // extension of the last loaded file, so Download keeps it
  const download = document.getElementById('download');

  function calculate() {
    const result = Balanzo.run(input.value);
    report.textContent = result.text;
    calculatedOk = result.ok;
    report.classList.remove('placeholder');
    calculatedText = input.value;
    updateStale();
    updateDownload();
    // Restart the highlight, so it shows on every calculation even when the report looks the same
    report.classList.remove('updated');
    void report.offsetWidth;
    report.classList.add('updated');
  }

  // Dims the report and says so once the input no longer matches it
  function updateStale() {
    if (calculatedText === null) return;
    const stale = input.value !== calculatedText;
    report.classList.toggle('stale', stale);
    if (stale) status.textContent = 'Text changed. Press Calculate to update the report.';
    else status.textContent = calculatedOk ? 'Report updated.' : 'No report yet. Fix the line named under WARNINGS, then press Calculate.';
  }

  // Download needs a calculation first, and some text to save; otherwise it would save an empty file
  function updateDownload() {
    download.disabled = calculatedText === null || !input.value.trim();
  }

  input.addEventListener('input', () => {
    updateStale();
    updateDownload();
    saveDraft();
  });

  // Title slug and local date-time, e.g. dinner-2026-11-14-2130.txt
  function downloadName() {
    const firstLine = input.value.split('\n')[0];
    const title = /^﻿?\s*#/.test(firstLine) ? firstLine.replace(/^﻿?\s*#/, '').trim() : '';
    const slug = title.replace(/[\\/:*?"<>|\x00-\x1f]+/g, '').trim().replace(/\s+/g, '-').slice(0, 60);
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
    return `${slug || 'expenses'}-${stamp}${fileExt}`;
  }

  document.getElementById('calculate').addEventListener('click', calculate);

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      calculate();
    }
  });

  function loadText(text) {
    input.value = text;
    calculate();
    saveDraft();
  }

  // Shared by the file picker and drag and drop
  async function loadFile(file) {
    if (!/\.(txt|md)$/i.test(file.name) && !['text/plain', 'text/markdown'].includes(file.type)) {
      report.textContent = `Not a .txt or .md file: ${file.name}`;
      report.classList.remove('placeholder');
      return;
    }
    fileExt = /\.md$/i.test(file.name) ? '.md' : '.txt';
    loadText(await file.text());
  }

  document.getElementById('load').addEventListener('click', () => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change', (event) => {
    if (event.target.files[0]) loadFile(event.target.files[0]);
    event.target.value = '';  // lets the same file be loaded again
  });

  // Drag and drop a .txt or .md file anywhere on the page
  let dragDepth = 0;
  window.addEventListener('dragenter', (event) => {
    if (!event.dataTransfer.types.includes('Files')) return;
    event.preventDefault();
    dragDepth++;
    document.body.classList.add('dragging');
  });
  window.addEventListener('dragover', (event) => {
    if (event.dataTransfer.types.includes('Files')) event.preventDefault();
  });
  window.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) {
      dragDepth = 0;
      document.body.classList.remove('dragging');
    }
  });
  window.addEventListener('drop', async (event) => {
    if (!event.dataTransfer.types.includes('Files')) return;
    event.preventDefault();  // stops the browser from opening the file
    dragDepth = 0;
    document.body.classList.remove('dragging');
    if (event.dataTransfer.files[0]) loadFile(event.dataTransfer.files[0]);
  });

  document.getElementById('copy').addEventListener('click', async (event) => {
    const button = event.target;
    try {
      await navigator.clipboard.writeText(report.textContent);
      button.textContent = 'Copied';
    } catch {
      // No clipboard access: select the report so it can be copied by hand
      const range = document.createRange();
      range.selectNodeContents(report);
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      status.textContent = 'Copying is blocked here. The report is selected: press Ctrl+C or ⌘+C to copy it.';
      return;
    }
    setTimeout(() => { button.textContent = 'Copy report'; }, 1500);
  });

  // The report first, then the expenses it was made from, so the file explains itself
  download.addEventListener('click', () => {
    const text = `${Balanzo.run(input.value).text}\nEXPENSES\n${input.value}`;
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = downloadName();
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // Draft: the text in the box, kept on this device. It is saved 0.5 seconds after the last change,
  // restored on the next visit, and dropped after 30 days without an edit or when the box is emptied.
  const DRAFT_KEY = 'balanzo-draft';
  const DRAFT_MAX_AGE = 30 * 24 * 60 * 60 * 1000;
  const draftNote = document.getElementById('draft');
  let draftTimer = null;

  const clock = (date) => `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

  function saveDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(writeDraft, 500);
  }

  function writeDraft() {
    clearTimeout(draftTimer);
    draftTimer = null;
    try {
      if (input.value.trim() === '') {
        localStorage.removeItem(DRAFT_KEY);
        draftNote.textContent = '';
      } else {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ text: input.value, savedAt: Date.now() }));
        draftNote.textContent = `Draft saved on this device at ${clock(new Date())}.`;
      }
    } catch {
      draftNote.textContent = 'Draft not saved: this browser does not allow local storage here.';
    }
  }

  function restoreDraft() {
    try {
      const draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
      if (!draft || Date.now() - draft.savedAt > DRAFT_MAX_AGE) {
        localStorage.removeItem(DRAFT_KEY);
        return;
      }
      input.value = draft.text;
      calculate();
      draftNote.textContent = `Draft restored from ${clock(new Date(draft.savedAt))}.`;
    } catch {
      // Nothing usable saved: start with the empty box
    }
  }

  // A change made just before the tab closes is still saved
  window.addEventListener('pagehide', () => {
    if (draftTimer) writeDraft();
  });

  restoreDraft();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
